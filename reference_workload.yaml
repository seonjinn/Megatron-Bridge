
# Reference configurations (for comparison)
# These are the official MBridge performance benchmark settings
reference_configs:
  # DeepSeekV3 - MBridge Reference
  deepseek_v3:
    model_pattern: "deepseek_v3"
    tp: 1
    cp: 1
    ep: 64
    pp: 4
    dp: 1
    gbs: 2048
    gpus: 256
    seq_len: 4096
    precision: bf16
    task: pretrain

  # Qwen3 30B A3B - MBridge Reference (different from RL config)
  qwen3_30b_ref:
    model_pattern: "qwen3_30b"
    tp: 1
    cp: 1
    ep: 8
    pp: 1
    dp: 1  # Reference uses DP=1
    gbs: 512
    gpus: 8
    seq_len: 4096
    precision: bf16
    task: pretrain

  # Qwen3 235B A22B - MBridge Reference
  qwen3_235b:
    model_pattern: "qwen3_235b"
    tp: 1
    cp: 1
    ep: 8
    pp: 8
    dp: 1
    gbs: 1024
    gpus: 64
    seq_len: 4096
    precision: bf16
    task: pretrain