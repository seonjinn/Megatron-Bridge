# =============================================================================
# GB200 Reference Configurations (NeMo 25.07)
# =============================================================================
# Single source of truth for:
#   1. run_nemo2507_validation_sweep.sh - Job launching
#   2. collect_results.py - Result filtering and comparison
#
# Usage:
#   Sweep:   ./run_nemo2507_validation_sweep.sh [--dry-run] [--model MODEL]
#   Results: python3 collect_results.py --scan-all --match-config gb200_reference_configs.yaml --use-reference
#
# =============================================================================

metadata:
  description: "NeMo 25.07 GB200 Reference Configurations"
  source: "Official GB200 Performance Table"
  date: "2025-12-06"
  system: "gb200"
  gpus_per_node: 4
  
  # Metric calculation settings for collect_results.py
  # NeMo 25.07 style: 50 steps, average steps 35-50
  metric_calculation:
    max_steps: 50
    warmup_steps: 0        # Not used when metric_range is set
    metric_range: "35:50"  # Average steps 35-50 (1-indexed)

# =============================================================================
# Pre-train BF16 Configurations
# =============================================================================
pretrain_bf16:
  llama3_8b:
    # Matching collect_results.py format
    model_pattern: "llama3_8b"
    tp: 1
    pp: 1
    cp: 1
    ep: 1
    dp: 8
    vp: 1
    gpus: 8
    gbs: 128
    mbs: 2
    seq_len: 8192
    # Extended info for sweep script
    model_name: "llama3"
    model_size: "8b"
    precision: "bf16"
    task: "pretrain"
    fsdp: 0
    etp: 1
    recompute_layers: 0
    cpu_offload_layers: 0
    cuda_graphs: 1
    notes: "Dense model baseline"

  llama3_70b:
